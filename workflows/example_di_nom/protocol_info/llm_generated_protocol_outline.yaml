sequential_extraction:
  steps:
    - Step 1_sequential_extraction:
        SubSamplingProcess:
          id: # nmdc:subspr-{shoulder}-{blade}
          type: nmdc:SubSamplingProcess
          name: Subsample_soil
          description: A portion of soil being taken from <Biosample> soil sample for extraction
          has_input:
            - Biosample
          has_output:
            - ProcessedSample1_sequential_extraction
          processing_institution: EMSL
          mass:
            type: nmdc:QuantityValue
            has_raw_value: 0.3 g
            has_unit: g
            has_numeric_value: 0.3

    - Step 2_sequential_extraction:
        Extraction:
          id: # nmdc:extrp-{shoulder}-{blade}
          type: nmdc:Extraction
          name: Water_extraction_for_NOM
          description: Water extraction of <ProcessedSample1_sequential_extraction>
          has_input:
            - ProcessedSample1_sequential_extraction
          has_output:
            - ProcessedSample2_sequential_extraction # water extract
            - ProcessedSample3_sequential_extraction # soil for next step
          processing_institution: EMSL
          extraction_targets:
            - natural organic matter
          input_mass:
            type: nmdc:QuantityValue
            has_raw_value: 0.3 g # from subsampling process
            has_unit: g
            has_numeric_value: 0.3 # from subsampling process
          substances_used:
            - type: nmdc:PortionOfSubstance
              known_as: water
              substance_role: solvent
              volume:
                type: nmdc:QuantityValue
                has_raw_value: 1 mL
                has_unit: mL
                has_numeric_value: 1

    - Step 3_sequential_extraction:
        Extraction:
          id: # nmdc:extrp-{shoulder}-{blade}
          type: nmdc:Extraction
          name: Methanol_extraction_for_NOM
          description: Methanol extraction of <ProcessedSample3_sequential_extraction>
          has_input:
            - ProcessedSample3_sequential_extraction # from first extraction step
          has_output:
            - ProcessedSample4_sequential_extraction # methanol extract
          processing_institution: EMSL
          extraction_targets:
            - natural organic matter
          substances_used:
            - type: nmdc:PortionOfSubstance
              known_as: methanol
              substance_role: solvent
              volume:
                type: nmdc:QuantityValue
                has_raw_value: 1 mL
                has_unit: mL
                has_numeric_value: 1

    - Step 4_sequential_extraction:
        ChromatographicSeparationProcess:
          id: # nmdc:cspro-{shoulder}-{blade}
          type: nmdc:ChromatographicSeparationProcess
          name: Water_extract_SPE
          description: Solid phase extraction of dissolved organic matter from <ProcessedSample2_sequential_extraction>
          has_input:
            - ProcessedSample2_sequential_extraction # water extracts from earlier
          has_output:
            - ProcessedSample6_sequential_extraction # input to water DataGeneration records
          processing_institution: EMSL
          protocol_link:
            url: https://doi.org/10.4319/lom.2008.6.230
            name: Dittmar et al 2008. A simple and efficient method for the solid-phase extraction of dissolved organic matter (SPE-DOM) from seawater
            type: nmdc:Protocol
          chromatographic_category: solid_phase_extraction
          ordered_mobile_phases:
            - type: nmdc:MobilePhaseSegment   # Acidify sample (2uL 37% HCl into 5mL H2O sample)
              substances_used:
                - type: nmdc:PortionOfSubstance
                  known_as: hydrochloric_acid
                  substance_role: acid
                  source_concentration:
                    type: nmdc:QuantityValue
                    has_raw_value: 37 %
                    has_unit: '%'
                    has_numeric_value: 37
                  volume:
                    type: nmdc:QuantityValue
                    has_raw_value: 2 uL
                    has_unit: uL
                    has_numeric_value: 2
                - type: nmdc:PortionOfSubstance
                  known_as: water     # containing sample
                  substance_role: solvent
                  volume:
                    type: nmdc:QuantityValue
                    has_raw_value: 5 mL
                    has_unit: mL
                    has_numeric_value: 5
            - type: nmdc:MobilePhaseSegment   # Activate cartridge with 3mL methanol
              substances_used:
                - type: nmdc:PortionOfSubstance
                  known_as: methanol
                  substance_role: solvent
                  volume:
                    type: nmdc:QuantityValue
                    has_raw_value: 3 mL
                    has_unit: mL
                    has_numeric_value: 3
            - type: nmdc:MobilePhaseSegment   # Equilibrate cartridge with 5mL 10mM HCl
              substances_used:
                - type: nmdc:PortionOfSubstance
                  known_as: hydrochloric_acid
                  substance_role: acid
                  source_concentration:
                    type: nmdc:QuantityValue
                    has_raw_value: 10 mmol/L
                    has_unit: mmol/L
                    has_numeric_value: 10
                  volume:
                    type: nmdc:QuantityValue
                    has_raw_value: 5 mL
                    has_unit: mL
                    has_numeric_value: 5
            - type: nmdc:MobilePhaseSegment   # Wash the cartridge 17+x with 3mL 10mM HCl
              substances_used:
                - type: nmdc:PortionOfSubstance
                  known_as: hydrochloric_acid
                  substance_role: acid
                  source_concentration:
                    type: nmdc:QuantityValue
                    has_raw_value: 10 mmol/L
                    has_unit: mmol/L
                    has_numeric_value: 10
                  volume:
                    type: nmdc:QuantityValue
                    has_raw_value: 3 mL
                    has_unit: mL
                    has_numeric_value: 3
            - type: nmdc:MobilePhaseSegment   # Elute with 1.5 mL methanol
              substances_used:
                - type: nmdc:PortionOfSubstance
                  known_as: methanol
                  substance_role: solvent
                  volume:
                    type: nmdc:QuantityValue
                    has_raw_value: 1.5 mL
                    has_unit: mL
                    has_numeric_value: 1.5
          stationary_phase: PS-DVB

    - Step 5_sequential_extraction:
        ChromatographicSeparationProcess:
          id: # nmdc:cspro-{shoulder}-{blade}
          type: nmdc:ChromatographicSeparationProcess
          name: Methanol_extract_SPE
          description: Solid phase extraction of dissolved organic matter from <ProcessedSample4_sequential_extraction>
          has_input:
            - ProcessedSample4_sequential_extraction # methanol extracts from earlier
          has_output:
            - ProcessedSample7_sequential_extraction # input to methanol DataGeneration records
          processing_institution: EMSL
          protocol_link:
            url: https://doi.org/10.4319/lom.2008.6.230
            name: Dittmar et al 2008. A simple and efficient method for the solid-phase extraction of dissolved organic matter (SPE-DOM) from seawater
            type: nmdc:Protocol
          chromatographic_category: solid_phase_extraction
          ordered_mobile_phases:
            - type: nmdc:MobilePhaseSegment   # Acidify sample (2uL 37% HCl into 5mL H2O sample)
              substances_used:
                - type: nmdc:PortionOfSubstance
                  known_as: hydrochloric_acid
                  substance_role: acid
                  source_concentration:
                    type: nmdc:QuantityValue
                    has_raw_value: 37 %
                    has_unit: '%'
                    has_numeric_value: 37
                  volume:
                    type: nmdc:QuantityValue
                    has_raw_value: 2 uL
                    has_unit: uL
                    has_numeric_value: 2
                - type: nmdc:PortionOfSubstance
                  known_as: water     # containing sample (assuming dilution to 5mL with water for SPE)
                  substance_role: solvent
                  volume:
                    type: nmdc:QuantityValue
                    has_raw_value: 5 mL
                    has_unit: mL
                    has_numeric_value: 5
            - type: nmdc:MobilePhaseSegment   # Activate cartridge with 3mL methanol
              substances_used:
                - type: nmdc:PortionOfSubstance
                  known_as: methanol
                  substance_role: solvent
                  volume:
                    type: nmdc:QuantityValue
                    has_raw_value: 3 mL
                    has_unit: mL
                    has_numeric_value: 3
            - type: nmdc:MobilePhaseSegment   # Equilibrate cartridge with 5mL 10mM HCl
              substances_used:
                - type: nmdc:PortionOfSubstance
                  known_as: hydrochloric_acid
                  substance_role: acid
                  source_concentration:
                    type: nmdc:QuantityValue
                    has_raw_value: 10 mmol/L
                    has_unit: mmol/L
                    has_numeric_value: 10
                  volume:
                    type: nmdc:QuantityValue
                    has_raw_value: 5 mL
                    has_unit: mL
                    has_numeric_value: 5
            - type: nmdc:MobilePhaseSegment   # Wash the cartridge 17+x with 3mL 10mM HCl
              substances_used:
                - type: nmdc:PortionOfSubstance
                  known_as: hydrochloric_acid
                  substance_role: acid
                  source_concentration:
                    type: nmdc:QuantityValue
                    has_raw_value: 10 mmol/L
                    has_unit: mmol/L
                    has_numeric_value: 10
                  volume:
                    type: nmdc:QuantityValue
                    has_raw_value: 3 mL
                    has_unit: mL
                    has_numeric_value: 3
            - type: nmdc:MobilePhaseSegment   # Elute with 1.5 mL methanol
              substances_used:
                - type: nmdc:PortionOfSubstance
                  known_as: methanol
                  substance_role: solvent
                  volume:
                    type: nmdc:QuantityValue
                    has_raw_value: 1.5 mL
                    has_unit: mL
                    has_numeric_value: 1.5
          stationary_phase: PS-DVB

  processedsamples:
    - ProcessedSample1_sequential_extraction:
        ProcessedSample:
          id: #nmdc:
          type: nmdc:ProcessedSample
          name: <Biosample>_subsample
          description: The output from subsampling <Biosample> for extraction

    - ProcessedSample2_sequential_extraction:
        ProcessedSample:
          id: #nmdc:
          type: nmdc:ProcessedSample
          name: <Biosample>_NOM_water
          description: Water extract of <Biosample>
          sampled_portion: aqueous_layer

    - ProcessedSample3_sequential_extraction:
        ProcessedSample:
          id: #nmdc:
          type: nmdc:ProcessedSample
          name: <Biosample>_water_extracted_soil
          description: Water-extracted soil for further extraction of <Biosample>
          sampled_portion: pellet

    - ProcessedSample4_sequential_extraction:
        ProcessedSample:
          id: #nmdc:
          type: nmdc:ProcessedSample
          name: <Biosample>_NOM_methanol
          description: Methanol extract of <Biosample>
          sampled_portion: methanol_layer

    - ProcessedSample6_sequential_extraction:
        ProcessedSample:
          id: #nmdc:
          type: nmdc:ProcessedSample
          name: <Biosample>_NOM_water_SPE
          description: NOM from water extract and solid phase extraction of <Biosample>
          sampled_portion: aqueous_layer # Eluted in methanol

    - ProcessedSample7_sequential_extraction:
        ProcessedSample:
          id: #nmdc:
          type: nmdc:ProcessedSample
          name: <Biosample>_NOM_methanol_SPE
          description: NOM from methanol extract and solid phase extraction of <Biosample>
          sampled_portion: methanol_layer # Eluted in methanol